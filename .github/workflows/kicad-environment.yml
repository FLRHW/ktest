name: KiCad 10 environment

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  KICAD_CI_IMAGE: ghcr.io/flrhw/kibot-kicad10@sha256:dd3b846da945f204fa7b61916df34a99170b2a2095b49c3879cd96d414b8a7b8

jobs:
  verify-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check KiCad, KiBot and pcbnew
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            "$KICAD_CI_IMAGE" \
            -lc 'set -e; kicad-cli version; kibot --version; /usr/bin/python3 -c "import pcbnew; print(pcbnew.GetBuildVersion())"'

      - name: Run KiBot
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            --entrypoint /bin/bash \
            "$KICAD_CI_IMAGE" \
            -lc '
              set -e
              /usr/bin/python3 scripts/configure_blender_materials.py

              set -- *.kicad_pcb
              if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
                echo "Expected exactly one .kicad_pcb file in the project root"
                exit 1
              fi

              pcb_file="$1"
              sch_file="${pcb_file%.kicad_pcb}.kicad_sch"

              if [ ! -f "$sch_file" ]; then
                echo "Matching schematic not found: $sch_file"
                exit 1
              fi

              light_energy=$(/usr/bin/python3 -c "import sys, pcbnew; board=pcbnew.LoadBoard(sys.argv[1]); box=board.ComputeBoundingBox(True); size_mm=pcbnew.ToMM(max(box.GetWidth(), box.GetHeight())); print(0.15 * (size_mm / 25.0)**2)" "$pcb_file")
              echo "Calculated AREA light energy: $light_energy"

              mask_colours=$(/usr/bin/python3 scripts/pdf_mask_colours.py \
                --pcb "$pcb_file" \
                --lighten 0.75 \
                --opacity 0.50)
              read -r pdf_mask_top pdf_mask_bottom <<< "$mask_colours"

              kibot \
                -E AUTO_LIGHT_ENERGY="$light_energy" \
                -E PDF_MASK_TOP="$pdf_mask_top" \
                -E PDF_MASK_BOTTOM="$pdf_mask_bottom" \
                -c config.kibot.yaml \
                -e "$sch_file" \
                -b "$pcb_file" \
                -d output

              /usr/bin/python3 scripts/append_assembly_bom_v5.py \
                --pcb "$pcb_file" \
                --sch "$sch_file" \
                --config config.kibot.yaml \
                --define "AUTO_LIGHT_ENERGY=$light_energy" \
                --define "PDF_MASK_TOP=$pdf_mask_top" \
                --define "PDF_MASK_BOTTOM=$pdf_mask_bottom" \
                --output-dir output
            '
      - name: Record build information
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            --env KICAD_CI_IMAGE \
            --env SOURCE_COMMIT="$GITHUB_SHA" \
            --env SOURCE_REPOSITORY="$GITHUB_REPOSITORY" \
            --env SOURCE_REF="$GITHUB_REF" \
            --env BUILD_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --entrypoint /bin/bash \
            "$KICAD_CI_IMAGE" \
            -lc '
              set -e
              mkdir -p output

              {
                printf "%s\n" "KiCad project build information"
                printf "%s\n" "=============================="
                printf "Generated UTC: "
                date -u "+%Y-%m-%dT%H:%M:%SZ"
                printf "Repository: %s\n" "$SOURCE_REPOSITORY"
                printf "Source commit: %s\n" "$SOURCE_COMMIT"
                printf "Source ref: %s\n" "$SOURCE_REF"
                printf "Workflow run: %s\n" "$BUILD_URL"
                printf "Container image: %s\n" "$KICAD_CI_IMAGE"
                printf "\nKiCad: "
                kicad-cli version
                printf "KiBot: "
                kibot --version
                printf "Python: "
                /usr/bin/python3 --version
              } > output/build-info.txt

              cat output/build-info.txt
            '

      - name: Upload ERC and DRC reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: erc-drc-reports
          path: output/
          if-no-files-found: warn

      - name: Commit generated files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- output/
          if git diff --cached --quiet; then
            echo "Generated files have not changed"
          else
            git commit -m "Update KiBot outputs"
            git push origin "HEAD:$GITHUB_REF"
          fi


