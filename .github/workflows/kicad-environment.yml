name: KiCad 10 environment

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check KiCad, KiBot and pcbnew
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            ghcr.io/inti-cmnb/kicad10_auto_full:1.9.0 \
            -lc 'set -e; kicad-cli version; kibot --version; /usr/bin/python3 -c "import pcbnew; print(pcbnew.GetBuildVersion())"'

      - name: Check KiBot 1.9.1 image
        continue-on-error: true
        run: |
          docker run --rm --entrypoint /bin/bash \
            ghcr.io/inti-cmnb/kicad10_auto_full:1.9.1 \
            -lc 'kibot --version; kicad-cli version'

      - name: Run ERC and DRC
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            --entrypoint /bin/bash \
            ghcr.io/inti-cmnb/kicad10_auto_full:1.9.0 \
            -lc 'kibot -c config.kibot.yaml -e ktest.kicad_sch -b ktest.kicad_pcb -d output'

      - name: Upload ERC and DRC reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: erc-drc-reports
          path: output/
          if-no-files-found: warn

      - name: Commit generated files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- output/
          if git diff --cached --quiet; then
            echo "Generated files have not changed"
          else
            git commit -m "Update KiBot outputs"
            git push origin "HEAD:$GITHUB_REF"
          fi


