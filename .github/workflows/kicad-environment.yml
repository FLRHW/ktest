name: KiCad 10 environment

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check KiCad, KiBot and pcbnew
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            ghcr.io/inti-cmnb/kicad10_auto_full:1.9.0 \
            -lc 'set -e; kicad-cli version; kibot --version; /usr/bin/python3 -c "import pcbnew; print(pcbnew.GetBuildVersion())"'

      - name: Run ERC and DRC
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            --entrypoint /bin/bash \
            ghcr.io/inti-cmnb/kicad10_auto_full:1.9.0 \
            -lc 'kibot -c config.kibot.yaml -e ktest.kicad_sch -b ktest.kicad_pcb -d output'

      - name: Upload ERC and DRC reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: erc-drc-reports
          path: output/
          if-no-files-found: warn


