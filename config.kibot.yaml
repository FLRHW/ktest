kibot:
  version: 1

# Frequently changed settings

preflight:
  erc: true
  drc: true

outputs:
  - name: schematic_pdf
    type: pdf_sch_print
    dir: documentation


  - name: pcb_fabrication_pdf
    comment: Fabrication document
    type: pcb_print
    dir: documentation
    options:
      color_theme: _builtin_classic
      output: '%f-pcb-fabrication.%x'
      format: PDF
      title: fabrication
      scaling: 1.0
      plot_sheet_reference: true
      frame_plot_mechanism: internal
      colored_pads: false
      colored_vias: false
      realistic_solder_mask: false
      dpi: 1200

      pages:
        - sheet: 'Top fabrication (scale 1:1)'
          layer_var: 'Top fabrication (scale 1:1)'
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: Edge.Cuts
              color: '#000000'
            - layer: F.Cu
              color: '#F2F2F2'
            - layer: F.Mask
              color: '#E2E2E2'
            - layer: F.Paste
              color: '#E2E2E2'
            - layer: F.Silkscreen
              color: '#DBDBDB'

        - sheet: 'Bottom fabrication (scale 1:1)'
          layer_var: 'Bottom fabrication (scale 1:1)'
          mirror: true
          mirror_pcb_text: true
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: Edge.Cuts
              color: '#000000'
            - layer: B.Cu
              color: '#F2F2F2'
            - layer: B.Mask
              color: '#E2E2E2'
            - layer: B.Paste
              color: '#E2E2E2'
            - layer: B.Silkscreen
              color: '#DBDBDB'

        - sheet: '%ln (scale 1:1)'
          layer_var: '%ln (scale 1:1)'
          repeat_for_layer: F.Cu
          repeat_layers: copper
          repeat_inherit: false
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: F.Cu
#              color: '#000000'
            - layer: Edge.Cuts
              color: '#000000'

        - sheet: 'F.Mask (scale 1:1)'
          layer_var: 'F.Mask (scale 1:1)'
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: F.Mask
 #             color: '#000000'
            - layer: Edge.Cuts
              color: '#000000'

        - sheet: 'B.Mask (scale 1:1)'
          layer_var: 'B.Mask (scale 1:1)'
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: B.Mask
  #            color: '#000000'
            - layer: Edge.Cuts
              color: '#000000'

        - sheet: 'F.Silkscreen (scale 1:1)'
          layer_var: 'F.Silkscreen (scale 1:1)'
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: F.Silkscreen
              color: '#000000'
            - layer: Edge.Cuts
              color: '#000000'

        - sheet: 'B.Silkscreen (scale 1:1)'
          layer_var: 'B.Silkscreen (scale 1:1)'
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: B.Silkscreen
              color: '#000000'
            - layer: Edge.Cuts
              color: '#000000'

  - name: pcb_assembly_pdf
    comment: Assembly document
    type: pcb_print
    dir: documentation
    options:
      output: '%f-pcb-assembly.%x'
      format: PDF
      title: Assembly Document
      sheet_reference_layout: ''
      plot_sheet_reference: true
      frame_plot_mechanism: internal
      force_edge_cuts: false
      colored_pads: false
      colored_vias: false
      realistic_solder_mask: false
      dpi: 1200
      scaling: 1.0

      pages:
        - sheet: 'Assembly overview'
          layer_var: ''
          sheet_reference_color: '#000000'
          layers: []

        - sheet: 'Top assembly (Scale 1:1)'
          layer_var: 'Top assembly (Scale 1:1)'
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: Edge.Cuts
              color: '#000000'
            - layer: F.Cu
              color: '#EEDAB5'
            - layer: F.Mask
              color: '#B9B9B9'
            - layer: F.Paste
              color: '#E1A98E'
            - layer: F.Fab
              color: '#744679'

        - sheet: 'Bottom assembly (Scale 1:1)'
          layer_var: 'Bottom assembly (Scale 1:1)'
          mirror: true
          mirror_pcb_text: true
          sheet_reference_color: '#000000'
          colored_holes: true
          holes_color: '#FFFFFF'
          layers:
            - layer: Edge.Cuts
              color: '#000000'
            - layer: B.Cu
              color: '#D5DBF4'
            - layer: B.Mask
              color: '#B9B9B9'
            - layer: B.Paste
              color: '#BCB9DD'
            - layer: B.Fab
              color: '#400080'

  - name: fabrication_gerbers
    type: gerber
    dir: fabrication
    layers:
      - copper
      - F.Paste
      - B.Paste
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts
    options:
      use_protel_extensions: true
      create_gerber_job_file: true

  - name: fabrication_drills
    type: excellon
    dir: fabrication
    options:
      metric_units: true
      pth_and_npth_single_file: false

  - name: bom_csv
    type: bom
    dir: bom
    options:
      format: CSV

  - name: bom_xlsx
    type: bom
    dir: bom
    options:
      format: XLSX

  - name: interactive_bom
    type: ibom
    dir: bom

  - name: pick_and_place
    type: position
    dir: assembly
    options:
      format: CSV
      units: millimeters
      only_smd: true
      separate_files_for_front_and_back: true
      use_aux_axis_as_origin: false

  - name: board_step
    type: export_3d
    dir: 3d
    options:
      format: step

  - name: blender_render
    type: blender_export
    run_by_default: false
    dir: 3d
    options:
      light:
        - name: softbox
          type: AREA
          pos_x: '-size*3.33'
          pos_y: 'size*3.33'
          pos_z: 'size*5'
          energy: 1
      point_of_view:
        - view: top
          file_id: top
        - view: bottom
          file_id: bottom
        - view: top
          rotate_x: 15
          rotate_y: 25
          rotate_z: 0
          file_id: angled_top
        - view: bottom
          rotate_x: 15
          rotate_y: 25
          rotate_z: 0
          file_id: angled_bottom
      outputs:
        - type: render
          output: '%f-%i.%x'
      render_options:
        auto_crop: true
        samples: 32
        resolution_x: 1280
        resolution_y: 720
