kibot:
  version: 1

preflight:
  erc: true
  drc: true

outputs:
  - name: schematic_pdf
    type: pdf_sch_print
    dir: documentation

  - name: pcb_fabrication_pdf
    type: pcb_print
    dir: documentation
    options:
      format: PDF
      output: '%f-pcb-fabrication.%x'
      force_edge_cuts: true
      pages:
        - sheet: Front copper
          layers: [F.Cu]
        - sheet: Back copper
          layers: [B.Cu]
        - sheet: Front solder mask
          layers: [F.Mask]
        - sheet: Back solder mask
          layers: [B.Mask]

  - name: pcb_assembly_pdf
    type: pcb_print
    dir: documentation
    options:
      format: PDF
      output: '%f-pcb-assembly.%x'
      force_edge_cuts: true
      pages:
        - sheet: Front assembly
          layers: [F.Fab, F.SilkS]
          sketch_pads_on_fab_layers: true
        - sheet: Back assembly
          layers: [B.Fab, B.SilkS]
          sketch_pads_on_fab_layers: true
          mirror: true

  - name: fabrication_gerbers
    type: gerber
    dir: fabrication
    layers:
      - copper
      - F.Paste
      - B.Paste
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts
    options:
      use_protel_extensions: true
      create_gerber_job_file: true

  - name: fabrication_drills
    type: excellon
    dir: fabrication
    options:
      metric_units: true
      pth_and_npth_single_file: false

  - name: bom_csv
    type: bom
    dir: bom
    options:
      format: CSV

  - name: bom_xlsx
    type: bom
    dir: bom
    options:
      format: XLSX

  - name: interactive_bom
    type: ibom
    dir: bom

  - name: pick_and_place
    type: position
    dir: assembly
    options:
      format: CSV
      units: millimeters
      only_smd: true
      separate_files_for_front_and_back: true
      use_aux_axis_as_origin: false

  - name: board_step
    type: export_3d
    dir: 3d
    options:
      format: step

  - name: blender_render
    type: blender_export
    dir: 3d
    options:
      light:
        - name: softbox
          type: AREA
          pos_x: '-size*3.33'
          pos_y: 'size*3.33'
          pos_z: 'size*5'
          energy: 20
      point_of_view:
        - view: top
      outputs:
        - type: render
          output: '%f-3d-render-top.%x'
      render_options:
        samples: 32
        resolution_x: 1280
        resolution_y: 720
